[project]
name = "customer-intelligence-mcp"
version = "0.1.0"
description = "Stateless MCP connectors for customer intelligence email, calendar and research tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent"
version = "0.1.0"
description = "OpenAgent - a personal multi-agent OS. FastAPI backend (layered, scalable) + Next.js frontend. OpenAI-compatible LLM, graph-based multi-agent workflows."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Web / API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # DB (layered: models / repositories / services)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",          # async sqlite for dev; swap to asyncpg for postgres later
    # LLM (OpenAI-compatible only)
    "openai>=1.40",
    "httpx>=0.27",
    # MCP client
    "mcp>=1.0",
    # Config / validation
    "python-dotenv>=1.0",
    # Misc
    "rich>=13.7",
    "tenacity>=9.0",            # retry/backoff for LLM calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
    "alembic>=1.13",           # migrations (dev/optional; create_all used for dev)
    "mcp>=1.0",                # MCP client (optional; lazy-imported)
]

[project.scripts]
open-agent = "app.main:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]   # B008: FastAPI Depends() pattern

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[project]
name = "open-agent"
version = "0.1.0"
description = "OpenAgent - a personal multi-agent OS. FastAPI backend (layered, scalable) + Next.js frontend. OpenAI-compatible LLM, graph-based multi-agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Web / API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # DB (layered: models / repositories / services)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",          # async sqlite for dev; swap to asyncpg for postgres later
    # LLM (OpenAI-compatible only)
    "openai>=1.40",
    "httpx>=0.27",
    # MCP client
    "mcp>=1.0",
    # Auth / Security
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "email-validator>=2.0",
    "simpleeval>=0.9.13",
    "jsonschema>=4.22",
    "arq>=0.26",
    "redis>=5.0",
    "structlog>=26.1",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44",
    "prometheus-fastapi-instrumentator>=6,<9",
    "pyyaml>=6.0",
    # Config / validation
    "python-dotenv>=1.0",
    # Misc
    "rich>=13.7",
    "tenacity>=9.0",            # retry/backoff for LLM calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
    "alembic>=1.13",           # migrations (dev/optional; create_all used for dev)
    "mcp>=1.0",                # MCP client (optional; lazy-imported)
]

[project.scripts]
open-agent = "app.main:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "E402", "B904", "SIM105", "F841", "UP017", "UP042"]   # UP017/UP042: Python 3.10 compat

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

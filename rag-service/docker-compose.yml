# Docker Compose for the RAG service.
#
# Default: rag-service runs fully offline (in-memory vector store, local hashing
# embedder, in-memory BM25). No other services required.
#
#   docker compose up -d
#   curl http://localhost:8100/api/v1/health
#
# To use a real vector store / BM25, uncomment the qdrant / redis services below
# and set the matching env on rag-service (see comments).

services:
  rag-service:
    build: .
    image: rag-service:1.0.0
    container_name: rag-service
    ports:
      - "8100:8100"   # REST admin API  (http://localhost:8100/docs)
      - "8101:8101"   # MCP SSE server  (http://localhost:8101/sse)
    environment:
      RAG_ENV: production
      RAG_VECTOR_STORE: qdrant         # real vector DB (persistent)
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_QDRANT_ON_DISK: "true"       # mmap vectors to disk for scale
      RAG_BM25_BACKEND: memory         # -> "redis"  when redis service is enabled
      RAG_EMBEDDER: sentence_transformers   # local semantic embeddings
      RAG_ST_MODEL: BAAI/bge-m3               # 1024-dim multilingual embedding
      RAG_MCP_TRANSPORT: both
      # RAG_OPENAI_API_KEY: sk-...     # enable real semantic embeddings (openai extra installed)
      # RAG_REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - qdrant
    volumes:
      # Persist downloaded embedding models (e.g. BAAI/bge-m3) across
      # container recreates so they are not re-downloaded from HuggingFace.
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Uncomment for persistence of SQLite + on-disk data:
    # volumes:
    #   - rag-data:/app/data
    #   - ./rag.db:/app/rag.db

  # Real vector store. RAG_VECTOR_STORE above is set to "qdrant".
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped

  # Optional: Redis-backed BM25. Enable, then set RAG_BM25_BACKEND=redis above.
  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]
  #   restart: unless-stopped

volumes:
  rag-data:
  qdrant-data: {}
  hf-cache: {}

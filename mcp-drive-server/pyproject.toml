[project]
name = "mcp-drive-server"
version = "0.1.0"
description = "MCP server exposing Google Drive to open-agent (list + read files via MarkItDown)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0",
    "google-api-python-client>=2.120",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "markitdown[pdf,docx,xlsx,pptx]>=0.0.1a1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

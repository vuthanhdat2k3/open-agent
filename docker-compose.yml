services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openagent}
      POSTGRES_USER: ${POSTGRES_USER:-openagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openagent}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openagent} -d ${POSTGRES_DB:-openagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      OPENAGENT_HOST: 0.0.0.0
      OPENAGENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-openagent}:${POSTGRES_PASSWORD:-openagent}@postgres:5432/${POSTGRES_DB:-openagent}
      OPENAGENT_REDIS_URL: redis://redis:6379/0
      OPENAGENT_WORKFLOW_EXECUTION_MODE: ${OPENAGENT_WORKFLOW_EXECUTION_MODE:-inline}
      OPENAGENT_JWT_SECRET_KEY: ${OPENAGENT_JWT_SECRET_KEY:-local-dev-secret-change-me-32-bytes}
      OPENAGENT_COOKIE_SECURE: ${OPENAGENT_COOKIE_SECURE:-false}
      OPENAGENT_OTEL_ENABLED: ${OPENAGENT_OTEL_ENABLED:-false}
      OPENAGENT_OTEL_EXPORTER_ENDPOINT: ${OPENAGENT_OTEL_EXPORTER_ENDPOINT:-}
      OPENAGENT_S3_ENDPOINT_URL: http://minio:9000
      OPENAGENT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OPENAGENT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    environment:
      OPENAGENT_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-openagent}:${POSTGRES_PASSWORD:-openagent}@postgres:5432/${POSTGRES_DB:-openagent}
      OPENAGENT_REDIS_URL: redis://redis:6379/0
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  rag-service:
    build:
      context: ./rag-service
    environment:
      RAG_VECTOR_STORE: qdrant
      RAG_QDRANT_URL: http://qdrant:6333
    ports:
      - "8100:8100"
      - "8101:8101"
    depends_on:
      - qdrant

  mcp-drive-server:
    profiles: ["optional"]
    build:
      context: ./mcp-drive-server
    ports:
      - "8200:8200"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.1
    ports:
      - "3100:3100"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.113.0
    ports:
      - "4318:4318"

volumes:
  postgres-data:
  qdrant-data:
  minio-data:

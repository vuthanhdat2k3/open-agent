services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPENAGENT_POSTGRES_USER:-openagent}
      POSTGRES_PASSWORD: ${OPENAGENT_POSTGRES_PASSWORD:?Set OPENAGENT_POSTGRES_PASSWORD in .env to a random secret}
      POSTGRES_DB: ${OPENAGENT_POSTGRES_DB:-openagent}
    ports:
      # Bound to loopback only: this is a data-plane store, never a public
      # endpoint. Reachable from other containers via the compose network
      # regardless; the host-port mapping exists only for admin tooling
      # (psql, backups) run on the host itself.
      - "127.0.0.1:5433:5432"
    volumes:
      - openagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENAGENT_POSTGRES_USER:-openagent} -d ${OPENAGENT_POSTGRES_DB:-openagent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ZITADEL owns a separate database. The identity profile is explicit so a
  # disposable local stack can still run with local test fixtures; production
  # enables it and sets OPENAGENT_AUTH_PROVIDER=zitadel.
  zitadel-postgres:
    profiles: ["identity"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${ZITADEL_POSTGRES_USER:-zitadel}
      POSTGRES_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD:?Set ZITADEL_POSTGRES_PASSWORD when using the identity profile}
      POSTGRES_DB: ${ZITADEL_POSTGRES_DB:-zitadel}
    volumes:
      - zitadel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  zitadel-init:
    profiles: ["identity"]
    image: ghcr.io/zitadel/zitadel:v4.9.1@sha256:2a7317d98b933cde3586c40b8dfc0a5f472174f78816095bded5107e646dfb25
    command: ["init"]
    environment:
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${ZITADEL_POSTGRES_USER:-zitadel}:${ZITADEL_POSTGRES_PASSWORD}@zitadel-postgres:5432/${ZITADEL_POSTGRES_DB:-zitadel}?sslmode=disable
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_POSTGRES_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: ${ZITADEL_POSTGRES_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
    depends_on:
      zitadel-postgres:
        condition: service_healthy

  zitadel-setup:
    profiles: ["identity"]
    image: ghcr.io/zitadel/zitadel:v4.9.1@sha256:2a7317d98b933cde3586c40b8dfc0a5f472174f78816095bded5107e646dfb25
    user: "0"
    command: ["setup", "--masterkey", "${ZITADEL_MASTERKEY:?Set an exactly 32-character ZITADEL_MASTERKEY when using the identity profile}"]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?Set an exactly 32-character ZITADEL_MASTERKEY when using the identity profile}
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${ZITADEL_POSTGRES_USER:-zitadel}:${ZITADEL_POSTGRES_PASSWORD}@zitadel-postgres:5432/${ZITADEL_POSTGRES_DB:-zitadel}?sslmode=disable
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_POSTGRES_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-127.0.0.1.sslip.io}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8080}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:?Set ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD when using the identity profile}
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: OpenAgent Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:rw
    depends_on:
      zitadel-postgres:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully

  zitadel-api:
    profiles: ["identity"]
    image: ghcr.io/zitadel/zitadel:v4.9.1@sha256:2a7317d98b933cde3586c40b8dfc0a5f472174f78816095bded5107e646dfb25
    command: ["start", "--masterkey", "${ZITADEL_MASTERKEY:?Set an exactly 32-character ZITADEL_MASTERKEY when using the identity profile}", "--tlsMode", "disabled"]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?Set an exactly 32-character ZITADEL_MASTERKEY when using the identity profile}
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${ZITADEL_POSTGRES_USER:-zitadel}:${ZITADEL_POSTGRES_PASSWORD}@zitadel-postgres:5432/${ZITADEL_POSTGRES_DB:-zitadel}?sslmode=disable
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_POSTGRES_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-127.0.0.1.sslip.io}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8080}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_TLS_ENABLED: "false"
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:rw
    depends_on:
      zitadel-postgres:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
      zitadel-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  zitadel-login:
    profiles: ["identity"]
    image: ghcr.io/zitadel/zitadel-login:v4.9.1
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      # Must track ZITADEL_EXTERNALDOMAIN above - the login v2 UI validates
      # the Host header against the domain ZITADEL was configured with, so a
      # mismatch here breaks the OIDC login flow the moment a real domain is
      # set via ZITADEL_DOMAIN.
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN:-127.0.0.1.sslip.io}
      NODE_ENV: production
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy

  # Host port is configurable because Caddy (the `tls` profile, below) also
  # wants host port 80/443. The host binding here is *only* for a browser
  # reaching this container directly (e.g. the no-TLS/VPN-only deployment
  # mode) - Caddy always reaches it over the internal Docker network by
  # service name regardless of this value. When deploying with `--profile
  # tls`, set ZITADEL_PROXY_HOST_PORT to an unused port (or leave 80 free by
  # not running this without Caddy) so Caddy can own 80/443 on the host.
  zitadel-proxy:
    profiles: ["identity"]
    image: nginx:1.27-alpine
    ports:
      - "${ZITADEL_PROXY_HOST_PORT:-80}:80"
    volumes:
      - ./identity/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_started

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${OPENAGENT_REDIS_PASSWORD:?Set OPENAGENT_REDIS_PASSWORD in .env to a random secret}"]
    ports:
      # Loopback-only - see the postgres comment above for rationale.
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_AUTH: ${OPENAGENT_REDIS_PASSWORD:?Set OPENAGENT_REDIS_PASSWORD in .env to a random secret}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_AUTH ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Loopback-only - see the postgres comment above for rationale.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/langfuse-data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy

  langfuse-postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?Set LANGFUSE_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12.11.4-alpine
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
      TZ: UTC
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - ./observability/clickhouse/langfuse-settings.xml:/etc/clickhouse-server/config.d/langfuse-settings.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_AUTH ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.6.0
    environment: &langfuse-env
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://localhost:3002
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:?Set LANGFUSE_DATABASE_URL in .env}
      SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?Set LANGFUSE_REDIS_AUTH in .env}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-data
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-data
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3030/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.6.0
    ports:
      - "3002:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT: http://localhost:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-openagent}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-OpenAgent}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-openagent}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-OpenAgent}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?Set LANGFUSE_INIT_PROJECT_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?Set LANGFUSE_INIT_PROJECT_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?Set LANGFUSE_INIT_USER_EMAIL in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-OpenAgent Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?Set LANGFUSE_INIT_USER_PASSWORD in .env}
    depends_on: *langfuse-depends-on
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/public/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # Neither `api` nor `worker` mount the host Docker socket directly anymore
  # (a raw-socket mount there is root-equivalent host access — any RCE in
  # either service would be a full host takeover). They instead talk to this
  # locked-down proxy, which only allows the container-create/start/logs
  # calls the run_code/run_shell sandbox actually needs and denies
  # everything else (swarm, plugins, volumes, networks, secrets, exec-into-
  # other-container, etc). Note this narrows the blast radius but does not
  # by itself prevent a sandboxed container from being created with a host
  # bind mount — a fully isolated sandbox-runner API is the complete fix,
  # tracked as a follow-up.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Python Sandbox Image Builder
  # Builds the feature-packed Python sandbox (pandas, numpy, matplotlib, fpdf2, reportlab, pandoc)
  # used by run_code.
  sandbox-python:
    image: ${OPENAGENT_SANDBOX_PYTHON_IMAGE:-openagent-sandbox-python:local}
    build:
      context: ./backend
      dockerfile: sandbox/Dockerfile.python
    restart: "no"

  api:
    image: ${OPENAGENT_API_IMAGE:-openagent-api:local}
    build:
      context: ./backend
    volumes:
      - openagent_workspace:/app/workspace:rw
    environment:
      OPENAGENT_SANDBOX_DOCKER_IMAGE_PYTHON: ${OPENAGENT_SANDBOX_PYTHON_IMAGE:-openagent-sandbox-python:local}
      RAG_API_KEY: ${RAG_API_KEY:-}
      OPENAGENT_RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag-service:8100}
      OPENAGENT_RAG_MCP_URL: ${RAG_MCP_URL:-http://rag-service:8101/sse}
      OPENAGENT_DOCLING_SERVICE_URL: ${DOCLING_SERVICE_URL:-http://docling-service:8080}
      OPENAGENT_HOST: 0.0.0.0
      OPENAGENT_CORS_ORIGINS: ${OPENAGENT_CORS_ORIGINS:-http://127.0.0.1.sslip.io:3000,http://localhost:3000}
      OPENAGENT_RUNTIME: ${OPENAGENT_RUNTIME:-local}
      OPENAGENT_AUTH_PROVIDER: ${OPENAGENT_AUTH_PROVIDER:-local}
      OPENAGENT_PLATFORM_ADMIN_EMAILS: ${OPENAGENT_PLATFORM_ADMIN_EMAILS:-zitadel-admin@localhost}
      OPENAGENT_ZITADEL_ISSUER_URL: ${OPENAGENT_ZITADEL_ISSUER_URL:-http://zitadel:8080}
      OPENAGENT_ZITADEL_INTERNAL_URL: ${OPENAGENT_ZITADEL_INTERNAL_URL:-http://zitadel-api:8080}
      OPENAGENT_ZITADEL_PROJECT_ID: ${OPENAGENT_ZITADEL_PROJECT_ID:-}
      OPENAGENT_ZITADEL_CLIENT_ID: ${OPENAGENT_ZITADEL_CLIENT_ID:-}
      OPENAGENT_ZITADEL_CLIENT_SECRET: ${OPENAGENT_ZITADEL_CLIENT_SECRET:-}
      OPENAGENT_ZITADEL_ADMIN_PAT: ${OPENAGENT_ZITADEL_ADMIN_PAT:-}
      OPENAGENT_ZITADEL_REDIRECT_URI: ${OPENAGENT_ZITADEL_REDIRECT_URI:-http://127.0.0.1.sslip.io:8000/api/auth/callback}
      OPENAGENT_ZITADEL_POST_LOGOUT_REDIRECT_URI: ${OPENAGENT_ZITADEL_POST_LOGOUT_REDIRECT_URI:-http://127.0.0.1.sslip.io:3000/}
      OPENAGENT_DB_URL: ${OPENAGENT_DB_URL:?Set OPENAGENT_DB_URL in .env (see .env.example)}
      OPENAGENT_REDIS_URL: redis://:${OPENAGENT_REDIS_PASSWORD:?Set OPENAGENT_REDIS_PASSWORD in .env to a random secret}@redis:6379/0
      OPENAGENT_WORKFLOW_EXECUTION_MODE: ${OPENAGENT_WORKFLOW_EXECUTION_MODE:-inline}
      OPENAGENT_JWT_SECRET_KEY: ${OPENAGENT_JWT_SECRET_KEY:?Set OPENAGENT_JWT_SECRET_KEY in .env to a random 32-byte secret}
      OPENAGENT_CREDENTIAL_ENCRYPTION_KEY: ${OPENAGENT_CREDENTIAL_ENCRYPTION_KEY:-}
      OPENAGENT_COOKIE_SECURE: ${OPENAGENT_COOKIE_SECURE:-false}
      OPENAGENT_OTEL_ENABLED: ${OPENAGENT_OTEL_ENABLED:-false}
      OPENAGENT_OTEL_EXPORTER_ENDPOINT: ${OPENAGENT_OTEL_EXPORTER_ENDPOINT:-}
      OPENAGENT_OBSERVABILITY_ENABLED: ${OPENAGENT_OBSERVABILITY_ENABLED:-false}
      OPENAGENT_LANGFUSE_ENABLED: ${OPENAGENT_LANGFUSE_ENABLED:-false}
      OPENAGENT_LANGFUSE_PUBLIC_KEY: ${OPENAGENT_LANGFUSE_PUBLIC_KEY:-}
      OPENAGENT_LANGFUSE_SECRET_KEY: ${OPENAGENT_LANGFUSE_SECRET_KEY:-}
      OPENAGENT_LANGFUSE_BASE_URL: ${OPENAGENT_LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      OPENAGENT_LANGFUSE_FLUSH_TIMEOUT_SECONDS: ${OPENAGENT_LANGFUSE_FLUSH_TIMEOUT_SECONDS:-5}

      OPENAGENT_CI_MCP_URL: http://customer-intelligence-mcp:8301/sse
      OPENAGENT_CUSTOMER_INTELLIGENCE_ENABLED: ${OPENAGENT_CUSTOMER_INTELLIGENCE_ENABLED:-true}
      OPENAGENT_CI_CLASSIFIER_ENABLED: ${OPENAGENT_CI_CLASSIFIER_ENABLED:-true}
      OPENAGENT_CI_CLASSIFIER_ECONOMY_MODEL_ID: ${OPENAGENT_CI_CLASSIFIER_ECONOMY_MODEL_ID:-}
      OPENAGENT_CI_CLASSIFIER_STRONG_MODEL_ID: ${OPENAGENT_CI_CLASSIFIER_STRONG_MODEL_ID:-}
      OPENAGENT_CI_CLASSIFIER_TIMEOUT_S: ${OPENAGENT_CI_CLASSIFIER_TIMEOUT_S:-20}
      OPENAGENT_CI_CLASSIFIER_STRONG_TIMEOUT_S: ${OPENAGENT_CI_CLASSIFIER_STRONG_TIMEOUT_S:-30}
      CI_COMPANY_PROVIDER: ${CI_COMPANY_PROVIDER:-mcp}
      OPENAGENT_CI_BACKEND_PUBLIC_URL: ${OPENAGENT_CI_BACKEND_PUBLIC_URL:-http://127.0.0.1.sslip.io:8000}
      OPENAGENT_CI_FRONTEND_REDIRECT_URL: ${OPENAGENT_CI_FRONTEND_REDIRECT_URL:-http://127.0.0.1.sslip.io:3000/integrations}

      OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_ID: ${OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_ID:-}
      OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_SECRET: ${OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_SECRET:-}
      OPENAGENT_S3_ENDPOINT_URL: http://minio:9000
      OPENAGENT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OPENAGENT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OPENAGENT_SEARXNG_URL: ${OPENAGENT_SEARXNG_URL:-http://searxng:8080}
      OPENAGENT_CRAWLER_URL: ${OPENAGENT_CRAWLER_URL:-http://crawler:11235}
      OPENAGENT_CRAWLER_API_TOKEN: ${CRAWLER_API_TOKEN:?Set CRAWLER_API_TOKEN in .env to a random 32-byte secret}
      OPENAGENT_YOUTUBE_API_KEY: ${OPENAGENT_YOUTUBE_API_KEY:-}
      OPENAGENT_TINYFISH_API_KEY: ${OPENAGENT_TINYFISH_API_KEY:-}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      customer-intelligence-mcp:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    restart: unless-stopped
    image: ${OPENAGENT_API_IMAGE:-openagent-api:local}
    build:
      context: ./backend
    volumes:
      - openagent_workspace:/app/workspace:rw
    environment:
      OPENAGENT_SANDBOX_DOCKER_IMAGE_PYTHON: ${OPENAGENT_SANDBOX_PYTHON_IMAGE:-openagent-sandbox-python:local}
      RAG_API_KEY: ${RAG_API_KEY:-}
      OPENAGENT_RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag-service:8100}
      OPENAGENT_RAG_MCP_URL: ${RAG_MCP_URL:-http://rag-service:8101/sse}
      OPENAGENT_DOCLING_SERVICE_URL: ${DOCLING_SERVICE_URL:-http://docling-service:8080}
      OPENAGENT_RUNTIME: ${OPENAGENT_RUNTIME:-local}
      OPENAGENT_AUTH_PROVIDER: ${OPENAGENT_AUTH_PROVIDER:-local}
      OPENAGENT_PLATFORM_ADMIN_EMAILS: ${OPENAGENT_PLATFORM_ADMIN_EMAILS:-zitadel-admin@localhost}
      OPENAGENT_ZITADEL_ISSUER_URL: ${OPENAGENT_ZITADEL_ISSUER_URL:-http://zitadel:8080}
      OPENAGENT_ZITADEL_INTERNAL_URL: ${OPENAGENT_ZITADEL_INTERNAL_URL:-http://zitadel-api:8080}
      OPENAGENT_ZITADEL_PROJECT_ID: ${OPENAGENT_ZITADEL_PROJECT_ID:-}
      OPENAGENT_ZITADEL_CLIENT_ID: ${OPENAGENT_ZITADEL_CLIENT_ID:-}
      OPENAGENT_ZITADEL_CLIENT_SECRET: ${OPENAGENT_ZITADEL_CLIENT_SECRET:-}
      OPENAGENT_ZITADEL_ADMIN_PAT: ${OPENAGENT_ZITADEL_ADMIN_PAT:-}
      OPENAGENT_ZITADEL_REDIRECT_URI: ${OPENAGENT_ZITADEL_REDIRECT_URI:-http://127.0.0.1.sslip.io:8000/api/auth/callback}
      OPENAGENT_ZITADEL_POST_LOGOUT_REDIRECT_URI: ${OPENAGENT_ZITADEL_POST_LOGOUT_REDIRECT_URI:-http://127.0.0.1.sslip.io:3000/}
      OPENAGENT_DB_URL: ${OPENAGENT_DB_URL:?Set OPENAGENT_DB_URL in .env (see .env.example)}
      OPENAGENT_REDIS_URL: redis://:${OPENAGENT_REDIS_PASSWORD:?Set OPENAGENT_REDIS_PASSWORD in .env to a random secret}@redis:6379/0
      OPENAGENT_JWT_SECRET_KEY: ${OPENAGENT_JWT_SECRET_KEY:?Set OPENAGENT_JWT_SECRET_KEY in .env to a random 32-byte secret}
      OPENAGENT_CREDENTIAL_ENCRYPTION_KEY: ${OPENAGENT_CREDENTIAL_ENCRYPTION_KEY:-}
      OPENAGENT_OBSERVABILITY_ENABLED: ${OPENAGENT_OBSERVABILITY_ENABLED:-false}
      OPENAGENT_LANGFUSE_ENABLED: ${OPENAGENT_LANGFUSE_ENABLED:-false}
      OPENAGENT_LANGFUSE_PUBLIC_KEY: ${OPENAGENT_LANGFUSE_PUBLIC_KEY:-}
      OPENAGENT_LANGFUSE_SECRET_KEY: ${OPENAGENT_LANGFUSE_SECRET_KEY:-}
      OPENAGENT_LANGFUSE_BASE_URL: ${OPENAGENT_LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      OPENAGENT_LANGFUSE_FLUSH_TIMEOUT_SECONDS: ${OPENAGENT_LANGFUSE_FLUSH_TIMEOUT_SECONDS:-5}
      OPENAGENT_CI_MCP_URL: http://customer-intelligence-mcp:8301/sse
      OPENAGENT_CUSTOMER_INTELLIGENCE_ENABLED: ${OPENAGENT_CUSTOMER_INTELLIGENCE_ENABLED:-true}
      OPENAGENT_CI_CLASSIFIER_ENABLED: ${OPENAGENT_CI_CLASSIFIER_ENABLED:-true}
      OPENAGENT_CI_CLASSIFIER_ECONOMY_MODEL_ID: ${OPENAGENT_CI_CLASSIFIER_ECONOMY_MODEL_ID:-}
      OPENAGENT_CI_CLASSIFIER_STRONG_MODEL_ID: ${OPENAGENT_CI_CLASSIFIER_STRONG_MODEL_ID:-}
      OPENAGENT_CI_CLASSIFIER_TIMEOUT_S: ${OPENAGENT_CI_CLASSIFIER_TIMEOUT_S:-20}
      OPENAGENT_CI_CLASSIFIER_STRONG_TIMEOUT_S: ${OPENAGENT_CI_CLASSIFIER_STRONG_TIMEOUT_S:-30}
      CI_COMPANY_PROVIDER: ${CI_COMPANY_PROVIDER:-mcp}
      OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_ID: ${OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_ID:-}
      OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_SECRET: ${OPENAGENT_CI_GOOGLE_OAUTH_CLIENT_SECRET:-}
      OPENAGENT_SEARXNG_URL: ${OPENAGENT_SEARXNG_URL:-http://searxng:8080}
      OPENAGENT_CRAWLER_URL: ${OPENAGENT_CRAWLER_URL:-http://crawler:11235}
      OPENAGENT_CRAWLER_API_TOKEN: ${CRAWLER_API_TOKEN:?Set CRAWLER_API_TOKEN in .env to a random 32-byte secret}
      OPENAGENT_YOUTUBE_API_KEY: ${OPENAGENT_YOUTUBE_API_KEY:-}
      OPENAGENT_TINYFISH_API_KEY: ${OPENAGENT_TINYFISH_API_KEY:-}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      customer-intelligence-mcp:
        condition: service_started

  classification-worker:
    extends:
      service: worker
    command: ["arq", "app.worker.ClassificationWorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "app.worker.ClassificationWorkerSettings", "--check"]

  frontend:
    image: ${OPENAGENT_FRONTEND_IMAGE:-openagent-frontend:local}
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
        NEXT_PUBLIC_AUTH_PROVIDER: ${OPENAGENT_AUTH_PROVIDER:-local}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1.sslip.io:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://your-project-ref.supabase.co}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-your-supabase-publishable-key}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-supabase-anon-key}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1.sslip.io:8000}
      NEXT_PUBLIC_AUTH_PROVIDER: ${OPENAGENT_AUTH_PROVIDER:-local}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://your-project-ref.supabase.co}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-your-supabase-publishable-key}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-supabase-anon-key}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Opt-in TLS termination (profile "tls"). Terminates real HTTPS via Caddy's
  # automatic Let's Encrypt issuance and reverse-proxies to frontend/api/
  # zitadel-proxy over the internal compose network. sslip.io subdomains
  # (e.g. app.203.0.113.10.sslip.io) resolve to the host's real public IP,
  # so Let's Encrypt's HTTP-01 challenge works against them exactly like a
  # normal domain - no wildcard DNS record needed. Requires ports 80/443
  # reachable from the internet (80 for the ACME challenge + HTTP->HTTPS
  # redirect, 443 for HTTPS/HTTP-3). Enable alongside the `identity` profile
  # in production: `docker compose --profile identity --profile tls up -d`.
  # Cannot be exercised end-to-end in a sandboxed/offline environment - ACME
  # issuance needs a real, internet-reachable host and DNS. See
  # docs/deployment-runbook.md.
  caddy:
    profiles: ["tls"]
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    environment:
      OPENAGENT_APP_DOMAIN: ${OPENAGENT_APP_DOMAIN:?Set OPENAGENT_APP_DOMAIN in .env when using the tls profile, e.g. app.<host-ip>.sslip.io}
      OPENAGENT_API_DOMAIN: ${OPENAGENT_API_DOMAIN:?Set OPENAGENT_API_DOMAIN in .env when using the tls profile, e.g. api.<host-ip>.sslip.io}
      OPENAGENT_AUTH_DOMAIN: ${OPENAGENT_AUTH_DOMAIN:?Set OPENAGENT_AUTH_DOMAIN in .env when using the tls profile, e.g. auth.<host-ip>.sslip.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      # Loopback-only - see the postgres comment above for rationale.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  rag-service:
    image: ${OPENAGENT_RAG_IMAGE:-openagent-rag-service:local}
    build:
      context: ./rag-service
    environment:
      RAG_ENV: ${RAG_ENV:-development}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_VECTOR_STORE: qdrant
      RAG_QDRANT_URL: http://qdrant:6333
      DOCLING_SERVICE_URL: ${DOCLING_SERVICE_URL:-}
      DOCLING_OCR_ENGINE: ${DOCLING_OCR_ENGINE:-rapidocr}
      DOCLING_SERVICE_TIMEOUT_SECONDS: ${DOCLING_SERVICE_TIMEOUT_SECONDS:-90}
    volumes:
      - ./rag-service/rag_service:/app/rag_service
    ports:
      - "8100:8100"
      - "8101:8101"
    depends_on:
      - qdrant

  docling-service:
    image: ${OPENAGENT_DOCLING_IMAGE:-openagent-docling-service:local}
    build:
      context: ./docling-service
      args:
        DOCLING_COMMIT: 61d76f1ff3f8428065465889f7b4577da7df704c
    environment:
      DOCLING_OCR_ENGINE: ${DOCLING_OCR_ENGINE:-rapidocr}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  customer-intelligence-mcp:
    image: ${OPENAGENT_CI_MCP_IMAGE:-openagent-customer-intelligence-mcp:local}
    build:
      context: ./customer-intelligence-mcp
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8301
      CI_COMPANY_API_URL: ${CI_COMPANY_API_URL:-}
      CI_COMPANY_API_KEY: ${CI_COMPANY_API_KEY:-}
      SEARXNG_URL: http://searxng:8080
    expose:
      - "8301"

  searxng:
    image: searxng/searxng:2026.8.29-d226b78bc
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"

  crawler:
    image: unclecode/crawl4ai:0.9.2
    environment:
      # The image refuses a non-loopback bind (see crawler/config.yml) unless
      # this is set - required so the API isn't open/unauthenticated to
      # everything else on the compose network.
      CRAWL4AI_API_TOKEN: ${CRAWLER_API_TOKEN:?Set CRAWLER_API_TOKEN in .env to a random 32-byte secret}
    volumes:
      - ./crawler/config.yml:/app/config.yml:ro
    # Headless Chromium needs real shared memory; the 64MB Docker default
    # makes it crash on non-trivial pages.
    shm_size: "1gb"
    expose:
      - "11235"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11235/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.1
    ports:
      - "3100:3100"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.113.0
    ports:
      - "4318:4318"

volumes:
  openagent_workspace:
    name: openagent_workspace
  openagent_pgdata:
    name: openagent_pgdata
  zitadel_pgdata:
    name: zitadel_pgdata_v3
  zitadel_bootstrap:
    name: zitadel_bootstrap
  qdrant-data:
  minio-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-redis-data:
  caddy_data:
  caddy_config:

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      OPENAGENT_REDIS_URL: redis://redis:6379/0
      OPENAGENT_DB_URL: sqlite+aiosqlite:///./openagent.db
    command: sh -c "pip install -e . && arq app.worker.WorkerSettings"
    depends_on:
      redis:
        condition: service_healthy


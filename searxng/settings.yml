use_default_settings: true

server:
  # Internal-network-only instance (no host port mapping in docker-compose),
  # so a static secret is fine — nothing outside the compose network can
  # reach this to exploit cookie/session handling.
  secret_key: "openagent-searxng-internal-only"
  limiter: false

search:
  # JSON is disabled by default upstream to discourage scraping public
  # instances; this instance is never exposed to a host port, only called
  # by backend/customer-intelligence-mcp over the compose network.
  formats:
    - html
    - json

# The upstream defaults only enable duckduckgo/google cse/startpage/brave/
# wikipedia for general web search — a single burst of testing can get all
# five rate-limited or CAPTCHA'd at once (observed live), leaving zero
# redundancy. mojeek and yahoo are independent, keyless indexes not covered
# by that same anti-bot exposure; enabling them gives the aggregator other
# engines to fall back on when the defaults are throttled.
engines:
  - name: mojeek
    disabled: false
  - name: yahoo
    disabled: false

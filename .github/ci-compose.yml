services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openagent
      POSTGRES_PASSWORD: openagent
      POSTGRES_DB: openagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagent -d openagent"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    environment:
      OPENAGENT_DB_URL: postgresql+asyncpg://openagent:openagent@postgres:5432/openagent
      OPENAGENT_AUTH_PROVIDER: local

  worker:
    environment:
      OPENAGENT_DB_URL: postgresql+asyncpg://openagent:openagent@postgres:5432/openagent
      OPENAGENT_AUTH_PROVIDER: local

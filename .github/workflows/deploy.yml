# CD pipeline — deploys the full Docker Compose stack onto the self-hosted
# Windows runner whenever `deploy/dev` receives new commits (or manually via
# workflow_dispatch).
#
# Flow: PR merge vào `dev` (CI gate) -> merge/fast-forward sang `deploy/dev`
#       -> workflow này chạy trên runner self-hosted và `compose up`.
#
# Required repository VARIABLE (Settings -> Secrets and variables -> Actions
# -> Variables):
#   DEPLOY_ENV_FILE  Absolute path on the runner machine to the production
#                    .env file, e.g. G:\open-agent\.env. Kept out of git on
#                    purpose (credentials); see .gitignore.
#
# Images are built and pushed by CI for the exact commit SHA. This job only
# pulls and starts those images; it never runs `down -v`, so named volumes
# (postgres, qdrant, minio, ...) survive every deploy.

name: Deploy (self-hosted)

on:
  push:
    branches: [deploy/dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Preflight - Docker must be reachable
        shell: powershell
        run: |
          docker version --format '{{.Server.Version}}'
          if ($LASTEXITCODE -ne 0) { throw "Docker engine unreachable - is Docker Desktop running?" }

      - name: Resolve env file
        shell: powershell
        env:
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_ENV_FILE)) {
            throw "Repository variable DEPLOY_ENV_FILE is not set. Point it at the machine-local .env (e.g. G:\open-agent\.env)."
          }
          if (-not (Test-Path -LiteralPath $env:DEPLOY_ENV_FILE)) {
            throw "Env file not found: $env:DEPLOY_ENV_FILE"
          }
          Write-Host "Using env file: $env:DEPLOY_ENV_FILE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve source image SHA
        shell: powershell
        run: |
          $parents = (git rev-list --parents -n 1 HEAD).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          # deploy/dev may receive dev through a merge commit. The second
          # parent is the exact dev commit that CI built and pushed.
          if ($parents.Length -gt 2) { $imageTag = $parents[2] } else { $imageTag = $parents[1] }
          "IMAGE_TAG=$imageTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using image tag: $imageTag"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & start stack
        shell: powershell
        env:
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
        run: |
          $env:OPENAGENT_API_IMAGE = "ghcr.io/${{ github.repository_owner }}/open-agent/api:$env:IMAGE_TAG"
          $env:OPENAGENT_FRONTEND_IMAGE = "ghcr.io/${{ github.repository_owner }}/open-agent/frontend:$env:IMAGE_TAG"
          $env:OPENAGENT_RAG_IMAGE = "ghcr.io/${{ github.repository_owner }}/open-agent/rag-service:$env:IMAGE_TAG"
          $env:OPENAGENT_DOCLING_IMAGE = "ghcr.io/${{ github.repository_owner }}/open-agent/docling-service:$env:IMAGE_TAG"
          $env:OPENAGENT_CI_MCP_IMAGE = "ghcr.io/${{ github.repository_owner }}/open-agent/customer-intelligence-mcp:$env:IMAGE_TAG"
          docker container prune -f
          docker compose --env-file "$env:DEPLOY_ENV_FILE" --profile identity pull api worker frontend rag-service docling-service customer-intelligence-mcp
          docker compose --env-file "$env:DEPLOY_ENV_FILE" --profile identity up -d --no-build --remove-orphans
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed" }

      - name: Wait for API health
        shell: powershell
        timeout-minutes: 5
        run: |
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/healthz' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "API healthy"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 5
          }
          throw "API /healthz did not turn healthy within 8 minutes"

      - name: Wait for Frontend
        shell: powershell
        timeout-minutes: 5
        run: |
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/' -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -lt 500) { Write-Host "Frontend responding"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 5
          }
          throw "Frontend did not respond within 8 minutes"

      - name: Dump logs on failure
        if: failure()
        shell: powershell
        env:
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
        run: |
          docker compose --env-file "$env:DEPLOY_ENV_FILE" ps -a
          docker compose --env-file "$env:DEPLOY_ENV_FILE" logs --no-color --tail=100 api worker frontend

name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Create Python environment
        run: |
          & 'C:\Users\PC\AppData\Local\Programs\Python\Python312\python.exe' -m venv ..\.ci-venv
      - name: Start Redis
        run: |
          $port = 6000 + ([int64]$env:GITHUB_RUN_ID % 1000)
          docker run -d --name openagent-ci-redis-${{ github.run_id }} -p "127.0.0.1:${port}:6379" redis:7
          "OPENAGENT_REDIS_URL=redis://localhost:${port}/0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: ..\.ci-venv\Scripts\python.exe -m pip install -e ".[dev]"
      - run: ..\.ci-venv\Scripts\python.exe -m ruff check .
      - run: ..\.ci-venv\Scripts\python.exe -c "import yaml; yaml.safe_load(open('../observability/prometheus/alerts.yml'))"
      - run: ..\.ci-venv\Scripts\python.exe -m pytest -q
      - name: Stop Redis
        if: always()
        run: docker rm -f openagent-ci-redis-${{ github.run_id }}

  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start Redis
        run: |
          $port = 6000 + ([int64]$env:GITHUB_RUN_ID % 1000)
          docker run -d --name openagent-ci-redis-${{ github.run_id }} -p "127.0.0.1:${port}:6379" redis:7
          "OPENAGENT_REDIS_URL=redis://localhost:${port}/0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml', 'backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -c "import yaml; yaml.safe_load(open('../observability/prometheus/alerts.yml'))"
      - run: pytest -q
      - name: Stop Redis
        if: always()
        run: docker rm -f openagent-ci-redis-${{ github.run_id }}

  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  build-images:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: openagent-api:ci
          load: true
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Build frontend image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: openagent-frontend:ci
          load: true
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend
      - run: docker compose --env-file .env.example config

  compose-e2e:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      OPENAGENT_DB_URL: postgresql+asyncpg://openagent:openagent@postgres:5432/openagent
      OPENAGENT_JWT_SECRET_KEY: ci-secret-change-me-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f .github/ci-compose.yml --env-file .env.example up -d --build postgres redis api worker frontend
      - run: python scripts/e2e_agent_releases.py
      - run: python scripts/e2e_evaluations.py
      - run: python scripts/e2e_tenant_quotas.py
      - if: always()
        run: docker compose -f docker-compose.yml -f .github/ci-compose.yml --env-file .env.example logs --no-color api worker frontend
      - if: always()
        run: docker compose -f docker-compose.yml -f .github/ci-compose.yml --env-file .env.example down -v

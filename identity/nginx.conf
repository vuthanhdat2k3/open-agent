# A TLS-terminating hop in front of this proxy (Caddy, Cloudflare Tunnel)
# already sets X-Forwarded-Proto to the scheme the browser actually used.
# Overwriting it with nginx's own $scheme would report "http" even when the
# real client connection was https (Cloudflare Tunnel always relays to the
# origin over plain HTTP), which makes ZITADEL advertise an http:// issuer
# and breaks ID token validation. Preserve an inbound value; fall back to
# $scheme only when nothing set it (e.g. a bare VPN-only deployment).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    location /ui/v2/login/ {
        proxy_pass http://zitadel-login:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://zitadel-api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
